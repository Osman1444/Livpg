<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Livpg</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <!-- Editor shell: app bar, dock (add elements), stage (page), properties panel. Scripts below are plain (no build step). -->
    <header id="tb" aria-label="Editor toolbar">
      <div class="toolbar-brand"><button class="icon-button" data-k="home" data-icon="home" aria-label="Home" title="Home"></button><b class="ttl">Livpg</b></div>
      <div class="toolbar-actions">
        <div class="toolbar-group" role="group" aria-label="Editing">
          <button class="icon-button" data-k="undo" data-icon="undo" aria-label="Undo" title="Undo" disabled></button>
          <button class="icon-button" data-k="redo" data-icon="redo" aria-label="Redo" title="Redo" disabled></button>
          <button class="icon-button" data-k="multi" data-icon="select" aria-label="Select multiple" title="Select multiple" aria-pressed="false"></button>
        </div>
        <div class="toolbar-group" role="group" aria-label="Zoom">
          <button class="icon-button" data-k="zo" data-icon="minus" aria-label="Zoom out" title="Zoom out"></button>
          <button class="icon-button" data-k="zf" data-icon="fitWidth" aria-label="Fit width" title="Fit width" aria-pressed="false"></button>
          <button class="icon-button" data-k="zi" data-icon="plus" aria-label="Zoom in" title="Zoom in"></button>
        </div>
        <div class="toolbar-group" role="group" aria-label="Preview">
          <button class="icon-button" data-k="pc" data-icon="desktop" aria-label="Desktop preview" title="Desktop preview"></button>
          <button class="icon-button" data-k="ph" data-icon="phone" aria-label="Phone preview" title="Phone preview"></button>
        </div>
        <div class="toolbar-group" role="group" aria-label="Project">
          <button class="icon-button" data-k="op" data-icon="open" aria-label="Open project" title="Open project"></button>
          <button class="icon-button" data-k="th" data-icon="theme" aria-label="Toggle theme" title="Toggle theme"></button>
        </div>
      </div>
      <span id="save-status" role="status" aria-live="polite"></span>
      <button class="toolbar-export" data-k="ex" aria-label="Export HTML" title="Export HTML"><span data-export-icon></span><span>Export</span></button>
    </header>
    <main id="mid">
      <nav id="dock"></nav>
      <section id="cen">
        <div id="st">
          <div id="pw"><div id="pg"></div></div>
        </div>
        <div id="tabs">
          <div class="seg" id="seg"><i id="lens"></i></div>
          <div class="page-order" role="group" aria-label="Reorder current page">
            <button class="icon-button" data-k="page-prev" aria-label="Move page earlier" title="Move page earlier">←</button>
            <button class="icon-button" data-k="page-next" aria-label="Move page later" title="Move page later">→</button>
          </div>
          <button data-k="np">+ Page</button><button data-k="dp" class="dg">Delete</button>
        </div>
      </section>
      <aside id="pn"></aside>
    </main>
    <dialog id="dl">
      <h3 id="dh"></h3>
      <input id="du" dir="ltr" placeholder="Paste link here" />
      <div class="bt">
        <button id="dg" class="pb">Add link</button><button id="df">Choose file</button
        ><button id="dx">Cancel</button>
      </div>
    </dialog>
    <dialog id="shape-dialog" aria-labelledby="shape-title">
      <h3 id="shape-title">Add shape</h3>
      <div class="shape-grid">
        <button data-k="shape-rect"><span aria-hidden="true">▭</span>Rectangle</button>
        <button data-k="shape-ellipse"><span aria-hidden="true">◯</span>Ellipse</button>
        <button data-k="shape-triangle"><span aria-hidden="true">△</span>Triangle</button>
        <button data-k="shape-diamond"><span aria-hidden="true">◇</span>Diamond</button>
        <button data-k="shape-line"><span aria-hidden="true">╱</span>Line</button>
        <button data-k="shape-arrow"><span aria-hidden="true">→</span>Arrow</button>
      </div>
      <div class="bt"><button data-k="shape-close">Cancel</button></div>
    </dialog>
    <div id="pv" hidden><button class="pb" id="cl">Close</button><iframe id="fr"></iframe></div>
    <section id="home" hidden>
      <div class="hcard">
        <h1>Livpg</h1>
        <p class="mu">Pages that do more than a PDF.</p>
        <h4>New document</h4>
        <div id="sizes" class="sizes"></div>
        <div class="row hsize">
          <label>Width (px)<input id="cw" type="number" min="200" max="3000" /></label>
          <label>Height (px)<input id="ch" type="number" min="200" max="3000" /></label>
          <button id="orient">Rotate</button>
        </div>
        <div class="bt">
          <button class="pb" id="hnew">Create</button>
          <button id="hopen">Open project</button>
          <button id="hback" hidden>Back to editor</button>
        </div>
      </div>
    </section>
    <script src="js/state.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/render.js"></script>
    <script src="js/limits.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/history.js"></script>
    <script src="js/stage.js"></script>
    <script src="js/media.js"></script>
    <script src="js/drawing.js"></script>
    <script src="js/rich-text.js"></script>
    <script src="js/alignment.js"></script>
    <script src="js/constraints.js"></script>
    <script src="js/background.js"></script>
    <script src="js/ai-prompt.js"></script>
    <script src="js/selection.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/viewer-template.js"></script>
    <script src="js/exporter.js"></script>
    <script src="js/project.js"></script>
    <script src="js/home.js"></script>
    <script src="js/clipboard.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
